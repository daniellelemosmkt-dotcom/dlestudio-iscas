<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Funcionário</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Advercase";src:url(fontes/Advercase-Regular.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Advercase";src:url(fontes/Advercase-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
:root{
  --noite:#160E11; --noite2:#241A1E; --gelo:#F4F2EE; --branco:#FBFAF8; --graf:#292929;
  --mag:#8B083F; --acesa:#E2307A; --pessego:#FCEADF; --linha:#E2DAD3; --suave:#6B6266;
  --verde:#1E8E3E; --areia:#8A5A12;
  --disp:"Advercase","Playfair Display",Georgia,serif;
  --txt:"Poppins","Segoe UI",Arial,sans-serif;
  --sombra:0 14px 32px rgba(41,41,41,.07);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--gelo);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--gelo);color:var(--graf);font:400 15.5px/1.6 var(--txt);-webkit-font-smoothing:antialiased}
p{margin:0}
b{font-weight:600}
a{color:var(--mag)}
:focus-visible{outline:3px solid var(--mag);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:400;text-wrap:balance}
code{font:500 .88em ui-monospace,Consolas,monospace;background:var(--pessego);color:var(--mag);border-radius:5px;padding:2px 6px}

/* ===== esqueleto ===== */
.app{display:grid;grid-template-columns:258px 1fr;min-height:100vh}

/* menu */
.menu{background:var(--noite);color:#fff;padding:22px 16px 40px;display:flex;flex-direction:column;gap:22px;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.menu .marca{display:flex;flex-direction:column;gap:3px;padding:0 10px}
.menu .marca b{font:400 23px/1.1 var(--disp)}
.menu .marca small{font:600 10.5px var(--txt);letter-spacing:.16em;text-transform:uppercase;color:var(--acesa)}
.menu .quem{padding:0 10px;font-size:13px;color:#A9989E;border-top:1px solid #33262B;padding-top:14px}
.menu .quem b{color:#fff;display:block;font-size:14.5px}
.grupo{display:flex;flex-direction:column;gap:3px}
.grupo .rot{font:600 10.5px var(--txt);letter-spacing:.16em;text-transform:uppercase;color:#7D6C72;padding:0 10px 6px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  color:#D9C9CF;font:500 14.5px var(--txt);padding:10px;border-radius:11px}
.menu button:hover{background:#2A1F24;color:#fff}
.menu button.at{background:var(--mag);color:#fff;font-weight:600}
.menu button .ic{width:18px;height:18px;flex:none;opacity:.9}
.menu button.sub{padding-left:28px;font-size:13.5px}

/* conteúdo */
.tela{display:none;padding:34px 34px 70px;max-width:1120px}
.tela.on{display:block}
.cab{display:flex;flex-direction:column;gap:9px;margin-bottom:26px;max-width:62ch}
.cab .eb{font:600 11.5px var(--txt);letter-spacing:.15em;text-transform:uppercase;color:var(--mag)}
.cab h2{font-size:clamp(30px,4.2vw,44px);line-height:1.02}
.cab p{color:var(--suave)}

.cartao{background:var(--branco);border:1px solid var(--linha);border-radius:20px;box-shadow:var(--sombra);padding:22px;display:flex;flex-direction:column;gap:13px;margin-bottom:16px;min-width:0}
.cartao h3{font-size:21px}
.grade{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.grade .cartao{margin-bottom:0}
.cartao ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
li,p{overflow-wrap:break-word}

.tag{display:inline-block;background:var(--pessego);color:var(--mag);font:600 11px var(--txt);letter-spacing:.05em;text-transform:uppercase;padding:6px 11px;border-radius:999px;white-space:nowrap}
.tag.esc{background:var(--graf);color:#fff}
.tag.ok{background:#E4F1E8;color:var(--verde)}
.tag.esp{background:#FAEFDA;color:var(--areia)}
.tag.nao{background:#F7E4E8;color:#A4122F}
.tags{display:flex;flex-wrap:wrap;gap:7px}

/* estado vazio que ensina */
.vazio{background:var(--branco);border:1px dashed #CDBFB6;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px}
.vazio h3{font-size:22px}
.vazio p{color:var(--suave)}
.pedido{background:var(--noite);color:#F4F2EE;border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;gap:11px}
.pedido-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pedido-top b{font:600 11.5px var(--txt);letter-spacing:.12em;text-transform:uppercase;color:var(--acesa)}
.pedido pre{margin:0;white-space:pre-wrap;font:400 14px/1.6 var(--txt)}
.copiar{flex:none;font:600 13px var(--txt);background:var(--acesa);color:#fff;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;min-height:38px}
.copiar:hover{background:#C91F65}
.onde{font-size:13.5px;color:var(--suave)}

/* números */
.numeros{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));margin-bottom:16px}
.num{background:var(--branco);border:1px solid var(--linha);border-radius:18px;padding:18px 20px;box-shadow:var(--sombra);min-width:0}
.num .v{font:400 clamp(25px,2.6vw,34px)/1.05 var(--disp);display:block;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num .r{font:600 11px var(--txt);letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.num.destaque{background:var(--noite);border-color:var(--noite);color:#fff}
.num.destaque .r{color:#A9989E}

/* kanban */
.quadro{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(238px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px}
.coluna{background:#EFEBE6;border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:10px;min-width:0}
.coluna .ct{display:flex;justify-content:space-between;align-items:center;font:600 12.5px var(--txt);color:var(--suave);padding:0 4px}
.coluna .ct i{font-style:normal;background:#fff;border-radius:999px;padding:2px 9px;font-size:11.5px}
.ficha{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:13px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;display:flex;flex-direction:column;gap:5px}
.ficha:hover{border-color:var(--mag)}
.ficha b{font-size:15px}
.ficha small{color:var(--suave);font-size:12.5px}
.ficha .val{font:600 13.5px var(--txt);color:var(--mag)}

/* perfil do instagram */
.perfil{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:start}
.bolinha{width:132px;height:132px;border-radius:50%;background:#EFEBE6;border:3px solid #fff;outline:2px solid var(--linha);
  display:grid;place-items:center;color:#B5A8AD;font-size:12.5px;text-align:center;overflow:hidden}
.bolinha img{width:100%;height:100%;object-fit:cover}
.perfil .dir{display:flex;flex-direction:column;gap:13px;min-width:0}
.perfil .user{font:400 27px/1 var(--disp)}
.contagem{display:flex;gap:26px;flex-wrap:wrap;font-size:14.5px}
.contagem b{font-weight:600}
.bio{white-space:pre-wrap;font-size:14.5px;line-height:1.5}
.destaques{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.destaques .destaque{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px}
.destaques .destaque .circ{width:62px;height:62px;border-radius:50%;background:#EFEBE6;border:1px solid var(--linha);overflow:hidden}
.destaques .destaque .circ img{width:100%;height:100%;object-fit:cover}
.destaques .destaque small{font-size:11.5px;text-align:center;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:74px}
.gradeig{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:520px}
.gradeig .q{aspect-ratio:1;background:#EFEBE6;border:1px solid var(--linha);position:relative;overflow:hidden;cursor:pointer}
.gradeig .q img{width:100%;height:100%;object-fit:cover;display:block}
.gradeig .q .vz{position:absolute;inset:0;display:grid;place-items:center;color:#C3B6BB;font-size:11px}
.gradeig .q .et{position:absolute;top:6px;right:7px;font-size:10px;background:rgba(22,14,17,.72);color:#fff;border-radius:4px;padding:2px 6px}
@media (max-width:560px){.perfil{grid-template-columns:1fr}.bolinha{width:96px;height:96px}}

/* grade de conteúdos */
.conteudos{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(192px,1fr))}
.ct-item{background:var(--branco);border:1px solid var(--linha);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;display:flex;flex-direction:column}
.ct-item:hover{border-color:var(--mag)}
.ct-previa{aspect-ratio:1;background:#EFEBE6;display:grid;place-items:center;overflow:hidden;position:relative}
.ct-previa img,.ct-previa video{width:100%;height:100%;object-fit:cover}
.ct-previa .so-texto{padding:15px;font-size:13px;line-height:1.5;color:var(--graf);overflow:hidden;display:block;width:100%;height:100%}
.ct-pe{padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.ct-pe b{font-size:14px}
.ct-pe .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--suave)}

/* ficha aberta */
dialog{border:0;border-radius:22px;padding:0;max-width:620px;width:calc(100% - 32px);background:var(--branco);box-shadow:0 30px 70px rgba(22,14,17,.3)}
dialog::backdrop{background:rgba(22,14,17,.55)}
.jan{padding:24px;display:flex;flex-direction:column;gap:15px;max-height:85vh;overflow-y:auto}
.jan h3{font-size:25px}
.jan .fechar{position:absolute;top:14px;right:16px;background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--suave)}
.linhas{display:flex;flex-direction:column;gap:9px}
.linha{display:grid;grid-template-columns:142px 1fr;gap:12px;font-size:14.5px;padding-bottom:9px;border-bottom:1px solid var(--linha)}
.linha:last-child{border-bottom:0}
.linha .r{font:600 11px var(--txt);letter-spacing:.1em;text-transform:uppercase;color:var(--suave);padding-top:3px}
@media (max-width:520px){.linha{grid-template-columns:1fr;gap:3px}}
.porque{background:var(--pessego);border-radius:14px;padding:15px 17px;display:flex;flex-direction:column;gap:7px}
.porque .r{font:600 11px var(--txt);letter-spacing:.1em;text-transform:uppercase;color:var(--mag)}
.carrossel{position:relative;background:#EFEBE6;border-radius:14px;overflow:hidden;aspect-ratio:4/5;display:grid;place-items:center}
.carrossel img{width:100%;height:100%;object-fit:contain;background:#EFEBE6}
.carrossel video{width:100%;height:100%;object-fit:contain;background:#000}
.seta{position:absolute;top:50%;transform:translateY(-50%);background:rgba(251,250,248,.94);border:1px solid var(--linha);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center}
.seta.e{left:10px}.seta.d{right:10px}
.pontos{display:flex;gap:6px;justify-content:center}
.pontos i{width:7px;height:7px;border-radius:50%;background:var(--linha)}
.pontos i.on{background:var(--mag)}
.decisao{display:flex;gap:10px;flex-wrap:wrap}
.bt{font:600 14.5px var(--txt);border-radius:12px;padding:13px 19px;cursor:pointer;border:1px solid var(--linha);background:var(--branco);color:var(--graf);min-height:48px}
.bt.sim{background:var(--mag);border-color:var(--mag);color:#fff}
.bt.sim:hover{background:#73063A}
.bt:hover{border-color:#CDBFB6}
.marcado{font-size:13.5px;color:var(--verde);font-weight:600}
.marcado.nao{color:#A4122F}

/* gráfico */
.gr{width:100%;height:auto;display:block}
.legenda-gr{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--suave)}
.legenda-gr span{display:flex;align-items:center;gap:6px}
.legenda-gr i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* barra do celular */
.abrir-menu{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .menu{position:fixed;inset:0 auto 0 0;width:258px;transform:translateX(-100%);transition:transform .22s;z-index:50;height:100dvh}
  body.menu-on .menu{transform:none}
  body.menu-on::after{content:"";position:fixed;inset:0;background:rgba(22,14,17,.5);z-index:40}
  .abrir-menu{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;width:100%;background:var(--noite);color:#fff;
    border:0;padding:14px 16px;font:600 15px var(--txt);cursor:pointer}
  .tela{padding:22px 16px 60px}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important}}

/* ===== Meu WhatsApp ao vivo (só aparece com o ajudante ligado) ===== */
.duas{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start;margin-bottom:16px}
@media (max-width:980px){.duas{grid-template-columns:1fr}}
.conversas{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.cv{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:11px 12px;cursor:pointer;font:inherit;color:inherit}
.cv:hover{background:var(--gelo)}
.cv[aria-current="true"]{background:var(--pessego)}
.cv .foto{width:40px;height:40px;border-radius:50%;flex:none;background:var(--linha) center/cover no-repeat;display:grid;place-items:center;font:600 14px var(--txt);color:var(--suave)}
.cv .tx{min-width:0;flex:1}
.cv .tx b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv .tx span{display:block;font-size:13px;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv .bolha{flex:none;background:var(--mag);color:#fff;font:600 11px var(--txt);border-radius:999px;padding:3px 8px}
.fala{display:flex;flex-direction:column;gap:9px;max-height:420px;overflow:auto;padding:4px}
.msg{max-width:76%;padding:10px 14px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.dela{background:var(--gelo);border:1px solid var(--linha);border-bottom-left-radius:5px}
.msg.minha{background:var(--noite);color:#F4F2EE;align-self:flex-end;border-bottom-right-radius:5px}
.msg small{display:block;margin-top:5px;font-size:11px;opacity:.65}
.resposta-zap{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--linha);padding-top:14px}
.resposta-zap textarea{width:100%;min-height:84px;resize:vertical;font:400 15px var(--txt);color:var(--graf);background:var(--gelo);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.resposta-zap textarea:focus{outline:2px solid var(--mag);outline-offset:1px}
.pe{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.aviso{font-size:13.5px;color:var(--areia)}
.erro{background:#F7E4E8;color:#A4122F;border-radius:14px;padding:13px 16px;font-size:14.5px}
.nada{color:var(--suave);font-size:14px;padding:18px 4px}
</style>
</head>
<body>

<button class="abrir-menu" id="abrirMenu" type="button">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  Meu Funcionário
</button>

<div class="app">

  <nav class="menu" id="menu">
    <div class="marca">
      <small>DL Estúdio</small>
      <b>Meu Funcionário</b>
    </div>

    <div class="grupo">
      <button data-tela="hoje" class="at">Hoje</button>
    </div>

    <div class="grupo">
      <p class="rot">Vendas</p>
      <button data-tela="leads">Meus leads</button>
      <button data-tela="resultados" class="sub">Meus resultados</button>
    </div>

    <div class="grupo">
      <p class="rot">Presença</p>
      <button data-tela="redes">Minhas redes</button>
      <button data-tela="instagram" class="sub">Meu Instagram</button>
      <button data-tela="planejamento" class="sub">Meu planejamento</button>
      <button data-tela="conteudos" class="sub">Conteúdos para aprovar</button>
    </div>

    <div class="grupo">
      <p class="rot">Rotina</p>
      <button data-tela="whatsapp">Meu WhatsApp</button>
      <button data-tela="dia" class="sub">Meu dia</button>
    </div>

    <div class="grupo">
      <p class="rot">A minha base</p>
      <button data-tela="negocio">Meu negócio</button>
      <button data-tela="marca">Minha marca</button>
      <button data-tela="cerebro">Meu cérebro</button>
    </div>

    <p class="quem" id="quem"><b>Sem dono ainda</b>Peça ao Claude para preencher o seu negócio.</p>
  </nav>

  <main id="main">
    <section class="tela on" id="t-hoje"></section>
    <section class="tela" id="t-leads"></section>
    <section class="tela" id="t-resultados"></section>
    <section class="tela" id="t-redes"></section>
    <section class="tela" id="t-instagram"></section>
    <section class="tela" id="t-planejamento"></section>
    <section class="tela" id="t-conteudos"></section>
    <section class="tela" id="t-whatsapp"></section>
    <section class="tela" id="t-dia"></section>
    <section class="tela" id="t-negocio"></section>
    <section class="tela" id="t-marca"></section>
    <section class="tela" id="t-cerebro"></section>
  </main>
</div>

<dialog id="janela"><button class="fechar" type="button" aria-label="Fechar">&times;</button><div class="jan" id="janConteudo"></div></dialog>

<script>window.DADOS = {};</script>
<script src="dados/negocio.js"></script>
<script src="dados/marca.js"></script>
<script src="dados/leads.js"></script>
<script src="dados/redes.js"></script>
<script src="dados/instagram.js"></script>
<script src="dados/planejamento.js"></script>
<script src="dados/conteudos.js"></script>
<script src="dados/dia.js"></script>
<script src="dados/whatsapp.js"></script>
<script src="dados/cerebro.js"></script>
<script src="dados/resultados.js"></script>
<script>
"use strict";
const D = window.DADOS;

/* Se algum arquivo da pasta dados não carregar, a tela continua de pé e mostra o estado vazio. */
D.negocio = D.negocio || {};
D.marca = D.marca || {};
D.leads = D.leads || {};
D.leads.colunas = D.leads.colunas || [
  {id: "novo", nome: "Chegou agora"}, {id: "conversa", nome: "Conversando"},
  {id: "proposta", nome: "Proposta enviada"}, {id: "fechado", nome: "Fechou"}, {id: "perdido", nome: "Não foi"}];
D.leads.fichas = D.leads.fichas || [];
D.redes = D.redes || {};
D.redes.disponiveis = D.redes.disponiveis || ["instagram", "facebook", "tiktok", "linkedin", "youtube"];
D.redes.minhas = D.redes.minhas || [];
D.instagram = D.instagram || {};
D.planejamento = D.planejamento || {};
D.conteudos = D.conteudos || {};
D.conteudos.itens = D.conteudos.itens || [];
D.dia = D.dia || {};
D.cerebro = D.cerebro || {};
D.resultados = D.resultados || {};
D.whatsapp = D.whatsapp || {};

/* ===== ajudantes ===== */
const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vazio = v => !v || (Array.isArray(v) && !v.length) || (typeof v === "string" && !v.trim());
const tem = v => !vazio(v);
const reais = n => "R$ " + (Number(n) || 0).toLocaleString("pt-BR", {minimumFractionDigits: 0, maximumFractionDigits: 0});
const dataBr = s => { if (!s) return ""; const p = String(s).slice(0,10).split("-"); return p.length === 3 ? p[2] + "/" + p[1] : s; };
const hoje = () => new Date().toISOString().slice(0,10);

function cab(eb, titulo, texto){
  return '<div class="cab"><p class="eb">' + e(eb) + '</p><h2>' + e(titulo) + '</h2><p>' + e(texto) + '</p></div>';
}
function pedido(rotulo, texto){
  return '<div class="pedido"><div class="pedido-top"><b>' + e(rotulo) + '</b>' +
    '<button class="copiar" type="button">Copiar o pedido</button></div><pre>' + e(texto) + '</pre></div>';
}
function telaVazia(titulo, explicacao, rotulo, texto, arquivo){
  return '<div class="vazio"><h3>' + e(titulo) + '</h3><p>' + e(explicacao) + '</p>' +
    pedido(rotulo, texto) +

/* gráfico de linha simples */
function grafLinha(pontos, rotuloY){
  if (pontos.length < 2) return "";
  const L = 60, R = 14, T = 16, B = 30, W = 720, H = 240;
  const vals = pontos.map(p => Number(p.v) || 0);
  const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  const alto = max === min ? max + 1 : max, baixo = max === min ? Math.max(0, min - 1) : min;
  const x = i => L + i * (W - L - R) / (pontos.length - 1);
  const y = v => T + (alto - v) * (H - T - B) / (alto - baixo || 1);
  const d = pontos.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(Number(p.v) || 0).toFixed(1)).join(" ");
  const area = d + " L" + x(pontos.length - 1).toFixed(1) + " " + (H - B) + " L" + L + " " + (H - B) + " Z";
  let g = '<svg class="gr" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + e(rotuloY) + '">';
  [0, .5, 1].forEach(f => {
    const v = baixo + (alto - baixo) * (1 - f), yy = y(v);
    g += '<line x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '" stroke="#E2DAD3" stroke-width="1"/>';
    g += '<text x="' + (L - 10) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end" font-family="Poppins,sans-serif" font-size="12" fill="#6B6266">' + Math.round(v).toLocaleString("pt-BR") + '</text>';
  });
  g += '<path d="' + area + '" fill="#8B083F" fill-opacity=".08"/>';
  g += '<path d="' + d + '" fill="none" stroke="#8B083F" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pontos.forEach((p, i) => { g += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(Number(p.v) || 0).toFixed(1) + '" r="4" fill="#8B083F"/>'; });
  const passo = Math.ceil(pontos.length / 6);
  pontos.forEach((p, i) => {
    if (i % passo && i !== pontos.length - 1) return;
    g += '<text x="' + x(i).toFixed(1) + '" y="' + (H - 9) + '" text-anchor="middle" font-family="Poppins,sans-serif" font-size="12" fill="#6B6266">' + e(p.r) + '</text>';
  });
  return g + '</svg>';
}

/* gráfico de barras */
function grafBarras(itens){
  if (!itens.length) return "";
  const L = 70, R = 14, T = 16, B = 34, W = 720, H = 250;
  const max = Math.max.apply(null, itens.map(i => Number(i.v) || 0)) || 1;
  const faixa = (W - L - R) / itens.length, larg = Math.min(74, faixa * .58);
  let g = '<svg class="gr" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Resultados por mês">';
  [0, .5, 1].forEach(f => {
    const v = max * (1 - f), yy = T + f * (H - T - B);
    g += '<line x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) + '" stroke="#E2DAD3" stroke-width="1"/>';
    g += '<text x="' + (L - 10) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end" font-family="Poppins,sans-serif" font-size="12" fill="#6B6266">' + Math.round(v).toLocaleString("pt-BR") + '</text>';
  });
  itens.forEach((it, i) => {
    const h = (Number(it.v) || 0) / max * (H - T - B);
    const cx = L + faixa * i + faixa / 2;
    g += '<rect x="' + (cx - larg / 2).toFixed(1) + '" y="' + (H - B - h).toFixed(1) + '" width="' + larg.toFixed(1) + '" height="' + Math.max(h, 1).toFixed(1) + '" rx="7" fill="' + (it.cor || "#8B083F") + '"/>';
    g += '<text x="' + cx.toFixed(1) + '" y="' + (H - 13) + '" text-anchor="middle" font-family="Poppins,sans-serif" font-size="12" fill="#6B6266">' + e(it.r) + '</text>';
  });
  return g + '</svg>';
}

  h += '<div class="cartao"><h3>Meu perfil hoje</h3><div class="perfil">' +

    '<div class="dir"><span class="user">@' + e(p.usuario) + '</span>' +
    '<div class="contagem">' +
      '<span><b>' + (Number(p.publicacoes) || 0).toLocaleString("pt-BR") + '</b> publicações</span>' +
      '<span><b>' + (Number(p.seguidores) || 0).toLocaleString("pt-BR") + '</b> seguidores</span>' +

    (tem(p.nome) ? '<b>' + e(p.nome) + '</b>' : "") +

  h += '<div class="cartao"><h3>A minha grade</h3>';

}

/* ===== WHATSAPP AO VIVO =====
   Esta parte conversa com o ajudante (meu-whatsapp.py) que roda na sua máquina.
   É ele quem guarda a sua chave e fala com o WhatsApp. A chave nunca chega até aqui.
   Sem o ajudante ligado, o painel continua funcionando igual, só sem as conversas. */

const ZAP = {ligado: false, final: "", colunas: [], conversas: [], tipo: "pessoas", aberta: null, enviando: false, relogio: null};
const ZAP_NOVAS = "__novas__";

const zapHora = ms => !ms ? "" : new Date(Number(ms)).toLocaleString("pt-BR", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});
const zapInicial = n => (n || "?").trim().charAt(0).toUpperCase();

async function zapPedir(caminho, corpo){
  const r = await fetch(caminho, corpo ? {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(corpo)
  } : undefined);
  return r.json();
}

/* em que coluna esta conversa está: a primeira etiqueta dela que virou coluna */
function zapColunaDe(c){
  const et = c.etiquetas || [];
  const achou = ZAP.colunas.find(col => et.indexOf(col.id) >= 0);
  return achou ? achou.id : ZAP_NOVAS;
}

function zapQuadro(){
  const colunas = [{id: ZAP_NOVAS, nome: "Novas conversas"}].concat(ZAP.colunas);
  return '<div class="quadro">' + colunas.map(col => {
    const dela = ZAP.conversas.filter(c => zapColunaDe(c) === col.id);
    return '<div class="coluna"><div class="ct"><span>' + e(col.nome) + '</span><i>' + dela.length + '</i></div>' +
      (dela.length ? dela.map(c =>
        '<button class="ficha" data-zap="' + e(c.id) + '">' +
          '<b>' + e(c.nome) + '</b>' +
          '<small>' + e((c.ultimaMensagem || "sem texto").slice(0, 70)) + '</small>' +
          (c.naoLidas ? '<span class="val">' + c.naoLidas + (c.naoLidas > 1 ? " não lidas" : " não lida") + '</span>' : "") +
          (c.quando ? '<small>' + e(zapHora(c.quando)) + '</small>' : "") +
        '</button>').join("") : '<p class="nada">vazia</p>') +
      '</div>';
  }).join("") + '</div>';
}

function zapPintar(){
  const alvo = document.getElementById("zapVivo");
  if (!alvo) return;
  const esperando = ZAP.conversas.filter(c => c.naoLidas > 0).length;
  const naoLidas = ZAP.conversas.reduce((s, c) => s + c.naoLidas, 0);

  alvo.innerHTML =
    '<div class="cartao"><div class="tags"><span class="tag ok">ao vivo</span>' +
      (ZAP.final ? '<span class="tag esc">número final ' + e(ZAP.final) + '</span>' : "") +
      '<span class="tag" id="zapPessoas" role="button" tabindex="0">só pessoas</span>' +
      '<span class="tag esc" id="zapTodas" role="button" tabindex="0">com grupos</span></div>' +
      '<p class="onde">O quadro se atualiza sozinho a cada 30 segundos. As colunas são as etiquetas do seu WhatsApp: ' +
      'quando você move uma conversa aqui, a etiqueta muda lá também. A sua chave fica no whatsapp.json, na sua máquina.</p></div>' +
    '<div class="numeros">' +
      '<div class="num destaque"><span class="v">' + esperando + '</span><span class="r">conversas esperando</span></div>' +
      '<div class="num"><span class="v">' + naoLidas + '</span><span class="r">mensagens não lidas</span></div>' +
      '<div class="num"><span class="v">' + ZAP.conversas.length + '</span><span class="r">conversas recentes</span></div>' +
    '</div>' +
    zapQuadro() +
    (ZAP.colunas.length ? "" :
      '<div class="cartao" style="margin-top:16px"><h3>Você ainda não tem etiquetas no WhatsApp</h3>' +
      '<p>As colunas deste quadro são as etiquetas do seu WhatsApp Business. Crie as suas lá (por exemplo Lead, Reunião marcada, Cliente), ' +
      'coloque em algumas conversas, e elas viram colunas aqui sozinhas.</p>' +
      '<p class="onde">No celular: WhatsApp Business › Conversas › segure a conversa › Etiquetar.</p></div>');

  zapPintarFiltro();
}

function zapPintarFiltro(){
  const a = document.getElementById("zapPessoas"), b = document.getElementById("zapTodas");
  if (!a || !b) return;
  a.className = ZAP.tipo === "pessoas" ? "tag" : "tag esc";
  b.className = ZAP.tipo === "todas" ? "tag" : "tag esc";
}

function zapSemAjudante(){
  const alvo = document.getElementById("zapVivo");
  if (alvo) alvo.innerHTML = '<div class="cartao"><h3>Ligue o seu WhatsApp nesta tela</h3>' +
    '<p>Com o ajudante ligado, as suas conversas de verdade aparecem aqui dentro, organizadas pelas suas etiquetas, e você responde por aqui mesmo. ' +
    'Ele roda na sua máquina e é quem guarda a sua chave.</p>' +
    pedido("Pedido", "Liga o meu WhatsApp na tela: rode o meu-whatsapp.py desta pasta e me diga o endereço para eu abrir.") +
    '<p class="onde">Se preferir fazer à mão: abra esta pasta no terminal, rode <b>python meu-whatsapp.py</b> e abra o endereço que aparecer. ' +
    'Abrir o painel com dois cliques não mostra as conversas, porque sem o ajudante a tela não tem de onde ler.</p></div>';
  const leads = document.getElementById("zapLeads");
  if (leads) leads.innerHTML = "";
}

function zapAviso(texto){
  const alvo = document.getElementById("zapVivo");
  if (alvo) alvo.innerHTML = '<div class="cartao"><h3>Falta um passo para as conversas aparecerem</h3>' +
    '<div class="erro">' + e(texto) + '</div>' +
    '<p class="onde">O passo a passo do whatsapp.json está na sua biblioteca, na Parte 4.</p></div>';
}

async function zapComecar(){
  if (!document.getElementById("zapVivo") && !document.getElementById("zapLeads")) return;
  let st;
  try { st = await zapPedir("api/estado"); }
  catch (x) { ZAP.ligado = false; return zapSemAjudante(); }

  if (st.erro){ ZAP.ligado = false; return zapAviso(st.erro); }
  if (!st.ligado){
    ZAP.ligado = false;
    const alvo = document.getElementById("zapVivo");
    if (alvo) alvo.innerHTML = '<div class="cartao"><div class="tags"><span class="tag nao">desconectado</span></div>' +
      '<h3>O seu número caiu da ligação</h3><p>A sua instância existe, mas o WhatsApp não está conectado nela agora. ' +
      'Entre no painel da uazapi e leia o QR Code de novo, com o celular.</p></div>';
    return;
  }

  ZAP.ligado = true;
  ZAP.final = st.finalDoNumero || "";
  try {
    const et = await zapPedir("api/etiquetas");
    ZAP.colunas = et.etiquetas || [];
  } catch (x) { ZAP.colunas = []; }

  await zapCarregar();
  if (!ZAP.relogio) ZAP.relogio = setInterval(zapRelogio, 30000);
}

async function zapCarregar(){
  const r = await zapPedir("api/conversas?tipo=" + ZAP.tipo);
  if (r.erro) return zapAviso(r.erro);
  ZAP.conversas = r.conversas || [];
  zapPintar();
  zapPintarLeads();
}

/* o relógio: enquanto a janela estiver aberta, ele não mexe na tela, para não atrapalhar */
async function zapRelogio(){
  if (!ZAP.ligado) return;
  if (janela && janela.open) return;
  if (document.hidden) return;
  try { await zapCarregar(); } catch (x) {}
}

async function zapAbrir(id){
  ZAP.aberta = id;
  const c = ZAP.conversas.find(x => x.id === id) || {nome: "conversa"};
  const colAtual = zapColunaDe(c);
  const mover = [{id: ZAP_NOVAS, nome: "sem etiqueta"}].concat(ZAP.colunas)
    .filter(col => col.id !== colAtual)
    .map(col => '<button class="bt" data-mover="' + e(col.id) + '">' + e(col.nome) + '</button>').join("");

  abrir('<h3>' + e(c.nome) + '</h3>' +
    '<div class="tags">' + (c.grupo ? '<span class="tag">grupo</span>' : "") +
      '<span class="tag esc">' + e(colAtual === ZAP_NOVAS ? "sem etiqueta" : (ZAP.colunas.find(x => x.id === colAtual) || {}).nome || "") + '</span></div>' +
    '<div class="fala" id="zapFala"><p class="nada">Lendo as mensagens...</p></div>' +
    '<div class="resposta-zap"><textarea id="zapTexto" placeholder="Escreva a sua resposta..."></textarea>' +
      '<div class="pe"><button class="bt sim" id="zapEnviar">Enviar para ' + e(String(c.nome).split(" ")[0]) + '</button>' +
      '<span class="aviso" id="zapAviso">Ela sai do seu número, como se você tivesse digitado no celular.</span></div></div>' +
    (ZAP.colunas.length ? '<div class="porque"><span class="r">Mover para</span><div class="pe" style="margin-top:8px">' + mover + '</div></div>' : ""));

  const r = await zapPedir("api/mensagens?chatid=" + encodeURIComponent(id));
  const fala = document.getElementById("zapFala");
  if (!fala) return;
  if (r.erro){ fala.innerHTML = '<div class="erro">' + e(r.erro) + '</div>'; return; }
  const msgs = (r.mensagens || []).filter(m => m.texto);
  fala.innerHTML = msgs.length ? msgs.map(m =>
    '<div class="msg ' + (m.minha ? "minha" : "dela") + '">' + e(m.texto) + '<small>' + e(zapHora(m.quando)) + '</small></div>').join("")
    : '<p class="nada">O ajudante só enxerga as mensagens que chegaram depois que você ligou o seu número. As antigas continuam no seu celular. A caixa de resposta aqui embaixo funciona do mesmo jeito.</p>';
  fala.scrollTop = fala.scrollHeight;
}

async function zapEnviarResposta(){
  if (ZAP.enviando) return;
  const campo = document.getElementById("zapTexto"), aviso = document.getElementById("zapAviso"), bt = document.getElementById("zapEnviar");
  const texto = (campo.value || "").trim();
  if (!texto){ aviso.textContent = "Escreva a resposta antes de enviar."; return; }

  ZAP.enviando = true; bt.disabled = true; aviso.textContent = "Enviando...";
  const r = await zapPedir("api/responder", {chatid: ZAP.aberta, texto: texto});
  ZAP.enviando = false; bt.disabled = false;

  if (r.erro){ aviso.textContent = r.erro; return; }
  campo.value = "";
  aviso.textContent = "Enviada. Já está no celular da pessoa.";
  setTimeout(() => zapAbrir(ZAP.aberta), 1200);
}

async function zapMover(para){
  const c = ZAP.conversas.find(x => x.id === ZAP.aberta);
  if (!c) return;
  const atual = zapColunaDe(c);
  const r = await zapPedir("api/mover", {
    chatid: ZAP.aberta,
    tirar: atual === ZAP_NOVAS ? "" : atual,
    por: para === ZAP_NOVAS ? "" : para
  });
  if (r.erro){
    const aviso = document.getElementById("zapAviso");
    if (aviso) aviso.textContent = r.erro;
    return;
  }
  c.etiquetas = para === ZAP_NOVAS ? [] : [para];
  zapPintar();
  zapPintarLeads();
  janela.close();
}

/* as conversas que estão marcadas como lead aparecem também na tela de vendas */
function zapPintarLeads(){
  const alvo = document.getElementById("zapLeads");
  if (!alvo) return;
  if (!ZAP.ligado){ alvo.innerHTML = ""; return; }

  const colLead = ZAP.colunas.find(col => /lead|interess|or[çc]ament|propost/i.test(col.nome));
  const dela = colLead ? ZAP.conversas.filter(c => (c.etiquetas || []).indexOf(colLead.id) >= 0) : [];

  if (!colLead){
    alvo.innerHTML = '<div class="cartao"><h3>Do seu WhatsApp</h3>' +
      '<p class="onde">Marque com a etiqueta <b>Lead</b>, no seu WhatsApp, quem está pedindo orçamento. Essas conversas aparecem aqui sozinhas, ' +
      'e você responde sem sair do painel.</p></div>';
    return;
  }

  alvo.innerHTML = '<div class="cartao"><h3>Do seu WhatsApp, agora</h3>' +
    '<div class="tags"><span class="tag ok">ao vivo</span><span class="tag esc">' + e(colLead.nome) + '</span></div>' +
    (dela.length ? '<div class="quadro" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">' +
      dela.map(c => '<button class="ficha" data-zap="' + e(c.id) + '"><b>' + e(c.nome) + '</b>' +
        '<small>' + e((c.ultimaMensagem || "sem texto").slice(0, 70)) + '</small>' +
        (c.naoLidas ? '<span class="val">' + c.naoLidas + " esperando" + '</span>' : "") + '</button>').join("") + '</div>'
      : '<p class="onde">Ninguém com essa etiqueta agora.</p>') + '</div>';
}

document.addEventListener("click", ev => {
  const cv = ev.target.closest("[data-zap]");
  if (cv) return zapAbrir(cv.dataset.zap);
  const mv = ev.target.closest("[data-mover]");
  if (mv) return zapMover(mv.dataset.mover);
  if (ev.target.id === "zapEnviar") return zapEnviarResposta();

    ZAP.tipo = ev.target.id === "zapPessoas" ? "pessoas" : "todas";

    zapCarregar();
  }
});

  const alvo = document.getElementById("t-" + nome);
  if (!alvo) return;
  try { alvo.innerHTML = telas[nome](); } catch (x) {
    alvo.innerHTML = '<div class="vazio"><h3>Deu erro ao montar esta tela</h3><p>Algum arquivo de dados ficou com um erro de escrita. Peça ao Claude: "A tela ' + e(nome) + ' deu erro, confere os arquivos da pasta dados e conserta."</p><p class="onde">' + e(x.message) + '</p></div>';
  }
  alvo.querySelectorAll("[data-lead]").forEach(b => b.addEventListener("click", () => abrirLead(b.dataset.lead)));
  alvo.querySelectorAll("[data-conteudo]").forEach(b => b.addEventListener("click", () => abrirConteudo(b.dataset.conteudo)));
  if (nome === "whatsapp" || nome === "leads") { try { zapComecar(); } catch (x) {} }
}

function ir(nome){
  document.querySelectorAll(".tela").forEach(t => t.classList.toggle("on", t.id === "t-" + nome));
  document.querySelectorAll(".menu button").forEach(b => b.classList.toggle("at", b.dataset.tela === nome));
  document.body.classList.remove("menu-on");
  window.scrollTo(0, 0);
  try { localStorage.setItem("mf_tela", nome); } catch (x) {}
}

document.querySelectorAll(".menu button").forEach(b => b.addEventListener("click", () => ir(b.dataset.tela)));
document.getElementById("abrirMenu").addEventListener("click", () => document.body.classList.toggle("menu-on"));

document.addEventListener("click", ev => {
  const b = ev.target.closest(".copiar");
  if (!b) return;
  const pre = b.closest(".pedido").querySelector("pre");
  const rotulo = b.textContent;
  const ok = () => { b.textContent = "Copiado"; setTimeout(() => b.textContent = rotulo, 1800); };
  const sel = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Selecionado"; };
  try { navigator.clipboard.writeText(pre.innerText).then(ok, sel); } catch (x) { sel(); }
});

Object.keys(telas).forEach(desenhar);

if (tem(D.negocio.nome) || tem(D.negocio.oQueFaz)) {
  document.getElementById("quem").innerHTML = "<b>" + e(D.negocio.nome || "O meu negócio") + "</b>" + e(D.negocio.oQueFaz || "");
}
let inicial = "hoje";
try { const g = localStorage.getItem("mf_tela"); if (g && telas[g]) inicial = g; } catch (x) {}
ir(inicial);
</script>
